<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 340" width="100%" height="100%" class="tpc-brand-logo">
  <defs>
    <!-- Dark Mode Gradients -->
    <linearGradient id="tpcDarkPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="50%" stop-color="#00a2ff" />
      <stop offset="100%" stop-color="#0051ff" />
    </linearGradient>
    <linearGradient id="tpcDarkText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="tpcDarkGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.5"/>
    </filter>

    <!-- Light Mode Gradients -->
    <linearGradient id="tpcLightPrism" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="tpcLightText" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <filter id="tpcLightShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    .tpc-prism-edge {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s ease;
    }
    .tpc-circuit-trace {
      fill: none;
      stroke-width: 6;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: stroke 0.3s ease;
    }
    .tpc-circuit-node {
      transition: fill 0.3s ease;
    }
    .tpc-logo-text {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-weight: 900;
      letter-spacing: 4px;
      transition: fill 0.3s ease;
    }

    /* Dark Mode Styling (Default) */
    .tpc-prism-edge {
      stroke: url(#tpcDarkPrism);
      filter: url(#tpcDarkGlow);
    }
    .tpc-circuit-trace {
      stroke: #00f0ff;
      filter: url(#tpcDarkGlow);
    }
    .tpc-circuit-node {
      fill: #00f0ff;
      stroke: #0284c7;
      stroke-width: 3;
    }
    .tpc-logo-text {
      fill: url(#tpcDarkText);
      filter: drop-shadow(0 2px 8px rgba(0, 114, 255, 0.4));
    }

    /* Light Mode Overrides */
    html:not(.dark) .tpc-prism-edge {
      stroke: url(#tpcLightPrism);
      filter: url(#tpcLightShadow);
    }
    html:not(.dark) .tpc-circuit-trace {
      stroke: #0284c7;
      filter: none;
    }
    html:not(.dark) .tpc-circuit-node {
      fill: #0284c7;
      stroke: #1d4ed8;
      stroke-width: 2.5;
    }
    html:not(.dark) .tpc-logo-text {
      fill: url(#tpcLightText);
      filter: drop-shadow(0 2px 4px rgba(15, 23, 42, 0.12));
    }
  </style>

  <!-- 3D Circuit Prism Emblem -->
  <g transform="translate(20, 10)">
    <!-- Circuit Traces branching left -->
    <!-- Top Trace -->
    <path d="M 130 90 L 105 90 L 90 65 L 75 65" class="tpc-circuit-trace" />
    <circle cx="72" cy="65" r="7" class="tpc-circuit-node" />

    <!-- Middle Trace -->
    <path d="M 130 115 L 115 115 L 100 135 L 65 135" class="tpc-circuit-trace" />
    <circle cx="62" cy="135" r="7" class="tpc-circuit-node" />

    <!-- Bottom Trace -->
    <path d="M 130 145 L 95 145 L 80 185 L 68 185" class="tpc-circuit-trace" />
    <circle cx="65" cy="185" r="7" class="tpc-circuit-node" />

    <!-- Isometric Hexagonal Prism / Chassis Frame -->
    <!-- Outer Hexagon / Prism Silhouette -->
    <path d="M 175 25 L 230 55 L 230 165 L 175 195 L 130 165 L 130 55 Z" class="tpc-prism-edge" />
    
    <!-- Vertical Center Spine -->
    <path d="M 175 25 L 175 195" class="tpc-prism-edge" stroke-width="7" />
    
    <!-- Internal Wireframe Facets (Right Face) -->
    <path d="M 175 25 L 230 110 L 175 110 L 230 55" class="tpc-prism-edge" stroke-width="5" />
    <path d="M 175 110 L 230 165" class="tpc-prism-edge" stroke-width="5" />
    <path d="M 175 195 L 230 110" class="tpc-prism-edge" stroke-width="5" />

    <!-- Internal Wireframe Facets (Left Face) -->
    <path d="M 130 55 L 175 110 L 130 165" class="tpc-prism-edge" stroke-width="5" />
  </g>

  <!-- Bold TPC Typography -->
  <text x="150" y="300" text-anchor="middle" font-size="78" class="tpc-logo-text">TPC</text>
</svg>
